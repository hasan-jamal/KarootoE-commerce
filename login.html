<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAROOTO</title>
    <link rel="shortcut icon" href="./images/karooto logo.svg" type="image/x-icon" />
    <!---Style CSS-->
    <link rel="stylesheet" href="./css/auth.css">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>
    <main>
        <section class="loginPage">
            <div class="d-flex">
                <div class="">
                    <h1>Sign In</h1>
                    <p>Welcome back! We're happy to see you again</p>
                    <form action="">
                        <div class="form-group d-flex flex-column">
                            <label class="style-font fontSize18 text-capitalize darkGreen2" for="phone">Phone Number
                                <span>*</span></label>
                            <div class="phone-input-container">
                                <!-- Dropdown Container -->
                                <div class="dropdown-phone-container">
                                    <div class="dropdown-phone-btn">
                                        <p class="style-font initl-phone">
                                            <img src="./images/علم-الصومال.png" alt="علم-الصومال" class="flag-size">
                                            <span>+252</span>
                                        </p>
                                        <img src="./images/CaretDown-black.svg" alt="Arrow-Down2" class="arrow-down2">
                                    </div>
                                    <div class="dropdown-phone-list">
                                        <p class="style-font" data-code="+252">
                                            <img src="./images/علم-الصومال.png" alt="علم-الصومال">
                                            <span class="style-font">+252</span>
                                        </p>
                                        <p class="style-font" data-code="+1">
                                            <img src="./images/flag-usa.png" alt="علم-أمريكا">
                                            <span>+1</span>
                                        </p>
                                    </div>
                                </div>
                                <div class="border-input"></div>
                                <!-- Input Field -->
                                <input type="tel" id="phone-number" class="style-font fontSize16" name="phone-number"
                                    placeholder="Enter the Phone Number" required>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Jquery Library -->
    <script src="./js/jquery/jquery.min.js"></script>
    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
